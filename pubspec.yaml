name: van_sales
description: "Offline-first van sales app for drivers and a distributor back office."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  supabase_flutter: ^2.5.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  connectivity_plus: ^6.0.3

  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.1
  path_provider: ^2.1.3
  excel: ^4.0.6

  go_router: ^14.2.0

  shared_preferences: ^2.3.2
  intl: ^0.20.2

  google_fonts: ^6.2.1
  url_launcher: ^6.3.0

  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env.example
    - assets/fonts/Inter-Regular.ttf
    - assets/fonts/Inter-Bold.ttf
    - assets/fonts/Vazirmatn-Regular.ttf
    - assets/fonts/Vazirmatn-Bold.ttf
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
